## Bible App — Laravel 12 + Livewire 3, SQLite, served by PHP-FPM 8.4.
##
## PUBLIC SITE. Reached at https://bible.b8.co.nz through a Cloudflare Tunnel
## (cloudflared on 10.0.10.31), which terminates TLS and forwards here over plain
## HTTP. Laravel is told the real scheme via X-Forwarded-Proto; the tunnel peer is
## listed in config/trustedproxy.php. Do not add HSTS or a TLS listener here -
## Cloudflare owns that edge.
##
## Assets are built with `npm run build` into public/build (no Vite dev server).

server {
    listen 80;
    listen [::]:80;
    server_name bible.b8.co.nz;

    root /var/www/personal/bible-app/public;
    index index.php;

    charset utf-8;

    # The app has no upload endpoints, and PHP would refuse anything larger anyway
    # (post_max_size 25M / upload_max_filesize 20M), so a 64M body was only ever a way
    # to stream a doomed request into FPM.
    client_max_body_size 2M;

    # Compression. nginx.conf has `gzip on` but leaves gzip_types commented, so only
    # text/html was compressed - CSS and JS shipped uncompressed. Scoped here rather
    # than edited globally, because 14 other vhosts share that file.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    access_log /var/log/nginx/bible.local.access.log;
    error_log  /var/log/nginx/bible.local.error.log;

    location / {
        include snippets/bible-headers.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # nativephp/mobile registers unauthenticated /_native/* routes on the web build and
    # its controller instantiates an attacker-named class. Blocked in the application by
    # BlockNativeRoutesOnWeb; denied here as well so it cannot come back via a package
    # upgrade or a middleware regression.
    location ^~ /_native/ {
        include snippets/bible-headers.conf;
        return 404;
    }

    # Vite output is content-hashed, so it is safe to cache hard. ONE Cache-Control:
    # `expires` already emits max-age, so adding another produced two conflicting
    # headers. Headers are re-included because this block would otherwise drop them.
    location ^~ /build/ {
        include snippets/bible-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires off;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/bible-headers.conf;

        # Refuse requests for .php paths that do not exist rather than handing the
        # remainder to FPM as PATH_INFO. Safe today only because cgi.fix_pathinfo is at
        # its commented default; this makes it explicit.
        try_files $uri =404;

        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Cloudflare terminates TLS, so without this Laravel would generate http:// URLs
        # for anything that bypasses the trusted-proxy path.
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
