## Bible App — Laravel 12 + Livewire 3, SQLite, served by PHP-FPM 8.4.
##
## PUBLIC SITE. Reached at https://bible.b8.co.nz through a Cloudflare Tunnel
## (cloudflared on 10.0.10.31 - NOT this host), which terminates TLS and forwards here over
## plain HTTP. Laravel learns the real scheme and client from X-Forwarded-Proto/-For; the tunnel
## peer is the only trusted proxy (config/trustedproxy.php). Do not add HSTS or a TLS listener
## here - Cloudflare owns that edge. Do not add real_ip_header either: Laravel resolves the
## client itself, and nginx rewriting $remote_addr would break the trusted-proxy check.
##
## LIVE FILE: /etc/nginx/sites-available/bible.local is a SYMLINK to this file in the live tree,
## so a deploy changes nginx config only together with the app. After a deploy that touches it:
## `nginx -t && systemctl reload nginx`.
##
## Assets are built with `npm run build` into public/build (no Vite dev server).

# http context (this file is included inside http {}). $remote_addr is always the tunnel, so the
# client address comes from Cloudflare's header - for reading logs only, never for trust.
log_format bible_cf '$remote_addr cf=$http_cf_connecting_ip [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name bible.b8.co.nz;

    # Only the tunnel and this host may reach the origin. Anything else on the LAN (or via
    # Tailscale/docker) could otherwise talk to PHP directly and forge forwarding headers.
    allow 10.0.10.31;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    root /var/www/personal/bible-app/public;
    index index.php;

    charset utf-8;

    # The app has no upload endpoints, and PHP would refuse anything larger anyway
    # (post_max_size 25M / upload_max_filesize 20M), so a 64M body was only ever a way
    # to stream a doomed request into FPM.
    client_max_body_size 2M;

    # Compression. nginx.conf has `gzip on` but leaves gzip_types commented, so only
    # text/html was compressed - CSS and JS shipped uncompressed. Scoped here rather
    # than edited globally, because 14 other vhosts share that file.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    access_log /var/log/nginx/bible.b8.co.nz.access.log bible_cf;
    error_log  /var/log/nginx/bible.b8.co.nz.error.log;

    location / {
        include snippets/bible-headers.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /index.php/books/... would otherwise reach Laravel with the script name stripped and
    # serve every page under a second, duplicate URL.
    location ^~ /index.php/ {
        include snippets/bible-headers.conf;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # nativephp/mobile registers unauthenticated /_native/* routes on the web build and
    # its controller instantiates an attacker-named class. Blocked in the application by
    # BlockNativeRoutesOnWeb; denied here as well so it cannot come back via a package
    # upgrade or a middleware regression.
    location ^~ /_native/ {
        include snippets/bible-headers.conf;
        return 404;
    }

    # Vite output is content-hashed, so it is safe to cache hard. ONE Cache-Control:
    # `expires` already emits max-age, so adding another produced two conflicting
    # headers. No `always`: a 404 for a missing asset must not be cached as immutable.
    # Headers are re-included because this block would otherwise drop them.
    location ^~ /build/ {
        include snippets/bible-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires off;
        access_log off;
        try_files $uri =404;
    }

    # Livewire's script, published to public/vendor/livewire (php artisan livewire:publish --assets;
    # re-published by composer's post-update-cmd). URLs carry ?id=<hash>, so cache hard - instead of
    # a PHP request for /livewire/livewire.min.js on every page view.
    location ^~ /vendor/livewire/ {
        include snippets/bible-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires off;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/bible-headers.conf;

        # Refuse .php paths that do not exist instead of handing them to FPM. PHP's
        # cgi.fix_pathinfo defaults to 1, under which /upload.jpg/x.php would execute
        # upload.jpg as PHP; with this check FPM never sees such a path.
        try_files $uri =404;

        # Dedicated pool, user `bible` (deploy/php-fpm/bible.conf) - not the shared [www] pool.
        fastcgi_pass unix:/run/php/bible.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # $https is empty here (the tunnel speaks plain HTTP), so this sets nothing today;
        # Laravel gets the scheme from X-Forwarded-Proto. Kept for a future TLS listener.
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
