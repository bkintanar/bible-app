# Shared response headers for bible.b8.co.nz.
#
# nginx has NO add_header inheritance: a location block containing ANY add_header
# discards every header inherited from the server block. The /build/ block set
# Cache-Control and thereby silently dropped X-Frame-Options and X-Content-Type-Options
# from every CSS and JS file. So the headers live in a snippet and are included
# explicitly in each location that needs them.
#
# `always` matters too: without it these are omitted on 4xx/5xx responses.
add_header X-Frame-Options        "SAMEORIGIN"                        always;
add_header X-Content-Type-Options "nosniff"                           always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;
