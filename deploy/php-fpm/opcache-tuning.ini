; Install as /etc/php/8.4/fpm/conf.d/99-opcache-tuning.ini, then `systemctl reload php8.4-fpm`.
; Applies to every pool on this host (one FPM master), and only raises limits.
;
; The defaults (10000 files, 8 MB of interned strings) are small for Laravel + vendor across the
; ~10 sites sharing this PHP; when either fills, opcache stops caching new scripts.
opcache.max_accelerated_files=32531
opcache.interned_strings_buffer=16
