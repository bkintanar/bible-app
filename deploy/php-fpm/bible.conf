; PHP-FPM pool for bible.b8.co.nz only. Install as /etc/php/8.4/fpm/pool.d/bible.conf, then
; `php-fpm8.4 -t && systemctl reload php8.4-fpm`.
;
; Why a pool of its own (audit SEC-5 / OPS-4): the shared [www] pool runs ~10 vhosts as www-data
; with max_children=5. Any of those sites could read this app's .env (APP_KEY) and write its
; database and OSIS source of truth, and a burst on one site starved the others.
[bible]
user = bible
group = bible

; nginx (www-data) connects; nothing else may.
listen = /run/php/bible.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recycle workers: a long-lived worker that once rendered a huge chapter keeps that memory.
pm.max_requests = 500

; Above nginx's fastcgi_read_timeout would be pointless; 60s is generous for this app.
request_terminate_timeout = 60s

; The app (code, storage, database, assets) and temp files only.
php_admin_value[open_basedir] = /var/www/personal/bible-app:/tmp
; Never map /x.jpg/y.php to x.jpg (nginx already refuses non-existent .php paths).
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_flag[expose_php] = off
